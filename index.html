  <script>
      (function () {
        const PARAM_KEYS = ["gclid", "wbraid", "gbraid"];
        const COOKIE_NAME = "ads_click_ids";
        const COOKIE_DAYS = 90;

        function getQueryParam(key) {
          return new URLSearchParams(window.location.search).get(key);
        }
        function setCookie(name, value, days) {
          const maxAge = days * 24 * 60 * 60;
          document.cookie = `${name}=${encodeURIComponent(value)}; Max-Age=${maxAge}; Path=/; SameSite=Lax`;
        }
        function getCookie(name) {
          const match = document.cookie.match(new RegExp("(^| )" + name + "=([^;]+)"));
          return match ? decodeURIComponent(match[2]) : null;
        }
        function safeJsonParse(str) { try { return JSON.parse(str); } catch { return {}; } }

        const captured = {};
        PARAM_KEYS.forEach(k => { const v = getQueryParam(k); if (v) captured[k] = v; });

        const stored = safeJsonParse(getCookie(COOKIE_NAME) || "{}");
        const merged = Object.assign({}, stored, captured);
        setCookie(COOKIE_NAME, JSON.stringify(merged), COOKIE_DAYS);

        function finalParams() {
          const out = {};
          PARAM_KEYS.forEach(k => {
            const v = getQueryParam(k) || merged[k];
            if (v) out[k] = v;
          });
          return out;
        }

        function injectIntoAnchor(a) {
          const fp = finalParams();
          if (!Object.keys(fp).length) return;

          const url = new URL(a.getAttribute("href"), window.location.origin);
          Object.keys(fp).forEach(k => {
            if (!url.searchParams.get(k)) url.searchParams.set(k, fp[k]);
          });
          a.setAttribute("href", url.toString());
        }

        function init() {
          // ✅ pega TODOS os links que saem pra ClickBank/vendor (à prova de wrapper errado)
          document.querySelectorAll('a[href*="secure.nervefresh.com"]').forEach(injectIntoAnchor);

          // fallback: qualquer id que começa com btn- se for <a>
          document.querySelectorAll('a[id^="btn-"]').forEach(injectIntoAnchor);
        }

        if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
        else init();
      })();
  </script>
